<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArgenIA · Presentación</title>
<style>
:root{--azul:#2a72b8;--azul2:#5b9fdc;--marino:#0b3d6e;--oro:#eeac37;--tinta:#1f2a3a;--ease:cubic-bezier(.22,1,.36,1);--pop:cubic-bezier(.34,1.45,.64,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#e9eef4;overflow:hidden}
body{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#escenario{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#fff 0%,#f3f6fa 55%,#e6ecf3 100%)}
.dia{position:absolute;inset:0;visibility:hidden;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .45s ease,visibility 0s .45s}
.dia.activa{visibility:visible;opacity:1;transition:opacity .7s ease .05s,visibility 0s}

/* ---------- Diapositiva 1 · Logo ---------- */
.logo-stage{display:flex;flex-direction:column;align-items:center;margin-top:-40px}
.go .logo-stage{animation:float 4.2s ease-in-out 4s infinite}
@keyframes float{50%{transform:translateY(-14px)}}
svg{width:560px;height:672px;overflow:visible;display:block}
svg *{transform-box:view-box;transform-origin:222px 473px}
svg g[transform]{transform-origin:0 0}
.a{opacity:0}

/* Intro */
.go .base{animation:grow .7s var(--pop) .15s both}
.go .net{animation:grow 1.2s var(--pop) .5s both}
.go .gold{animation:sweep 1s var(--ease) 1.1s both}
.go .unf{animation:unfurl 1.5s var(--ease) 1.5s both}
.go .rise{animation:rise 1.5s var(--ease) 1.95s both}
@keyframes grow{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
@keyframes sweep{from{transform:scale(0,.5);opacity:0}to{transform:none;opacity:1}}
@keyframes unfurl{0%{transform:rotate(42deg) scale(.5,.02);opacity:0}20%{opacity:1}100%{transform:none;opacity:1}}
@keyframes rise{0%{transform:scaleY(0);opacity:0}15%{opacity:1}100%{transform:none;opacity:1}}

/* Vida continua */
.go .sw{animation:sway 5.2s ease-in-out 3.6s infinite}
.go .br{animation:breathe 5.2s ease-in-out 3.6s infinite}
@keyframes sway{50%{transform:rotate(2.4deg)}}
@keyframes breathe{50%{transform:scaleY(1.02)}}
.dash{fill:none;stroke:var(--azul);stroke-width:1.6;stroke-dasharray:5 4}
.go .dash{animation:march 1.6s linear infinite}
@keyframes march{to{stroke-dashoffset:-9}}
.ring{fill:none;stroke:var(--azul);stroke-width:2;opacity:0}
.go .ring{animation:ring 3.2s ease-out 3.4s infinite}
.go .ring.r2{animation-delay:4.2s}
@keyframes ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(4.2);opacity:0}}
.go .tip{animation:glow 3.2s ease-in-out 3.6s infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 7px rgba(42,114,184,.9))}}

/* Wordmark */
.word{font-size:176px;line-height:1;margin-top:-26px;display:flex;color:var(--tinta);font-weight:300;letter-spacing:.01em}
.word span{display:inline-block;opacity:0}
.go .word span{animation:letra .9s var(--ease) calc(2.7s + var(--i)*.07s) both}
.word .ia{font-weight:800;color:var(--azul)}
.go .word .ia{animation:iaIn 1s var(--pop) 3.25s both}
@keyframes letra{from{opacity:0;transform:translateY(46px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes iaIn{0%{opacity:0;transform:scale(.4) translateY(30px);filter:blur(8px)}100%{opacity:1;transform:none;filter:none}}
.word::after{content:"";position:absolute}

/* Tira inferior */
.tira{position:absolute;left:0;right:0;bottom:0;height:30px;display:flex}
.tira i{display:block;height:100%;transform:scaleX(0);transform-origin:0 50%}
.tira i:nth-child(1){flex:0 0 36%;background:var(--azul)}
.tira i:nth-child(2){flex:0 0 12%;background:var(--oro)}
.tira i:nth-child(3){flex:1;background:var(--marino)}
.go .tira i{animation:tira 1.1s var(--ease) 3.5s both}
.go .tira i:nth-child(2){animation-delay:3.65s}.go .tira i:nth-child(3){animation-delay:3.8s}
@keyframes tira{to{transform:none}}

#ayuda{position:absolute;right:28px;top:22px;font:500 18px "Segoe UI",sans-serif;color:#8a97a8;opacity:.8}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div id="escenario">

<!-- 1 · Portada (logo animado) -->
<section class="dia activa" id="d1" aria-label="Portada">
  <div class="logo-stage">
    <svg viewBox="30 40 384 460" role="img" aria-label="Logo de ArgenIA">
      <defs>
        <linearGradient id="gAzul" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62a6e0"/><stop offset=".55" stop-color="#2f79c0"/><stop offset="1" stop-color="#16467f"/></linearGradient>
        <linearGradient id="gOro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2b447"/><stop offset="1" stop-color="#e29a2c"/></linearGradient>
        <linearGradient id="gBlanco" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f1f4f8"/></linearGradient>
        <filter id="sombra" x="-60%" y="-20%" width="220%" height="140%"><feDropShadow dx="7" dy="5" stdDeviation="8" flood-color="#0b2a4a" flood-opacity=".3"/></filter>
      </defs>

      <!-- capa trasera: oro + red de nodos (lado izquierdo, se espeja por JS) -->
      <g id="back">
        <g data-m class="gold a"><polygon points="55,375 133,325 222,470" fill="url(#gOro)"/></g>
        <g data-m class="net a">
          <path class="dash" d="M133,325 L55,375 L55,445 L222,473"/>
          <path class="dash" d="M133,325 L222,473" opacity=".6"/>
          <circle cx="55" cy="375" r="8.5" fill="var(--marino)"/>
          <circle cx="55" cy="445" r="8.5" fill="var(--marino)"/>
          <circle cx="133" cy="325" r="8.5" fill="var(--marino)" stroke="#fff" stroke-width="2.5"/>
        </g>
      </g>

      <!-- pétalos azules -->
      <g id="petals">
        <g data-m class="unf a"><g class="sw">
          <path class="dash" d="M127,155 L222,473" opacity=".55"/>
          <path d="M127,155 C95,230 100,400 222,473 C175,390 185,270 127,155 Z" fill="url(#gAzul)"/>
          <circle class="tip" cx="127" cy="155" r="11.5" fill="var(--azul)"/>
        </g></g>
      </g>

      <!-- pétalo central -->
      <g class="rise a"><g class="br">
        <path d="M222,60 C272,150 272,360 222,473 C172,360 172,150 222,60 Z" fill="url(#gBlanco)" filter="url(#sombra)"/>
        <path class="dash" d="M222,60 L222,473"/>
        <circle class="tip" cx="222" cy="60" r="12.5" fill="var(--azul)"/>
      </g></g>

      <!-- nodo base -->
      <circle class="ring" cx="222" cy="473" r="12"/>
      <circle class="ring r2" cx="222" cy="473" r="12"/>
      <g class="base a"><circle cx="222" cy="473" r="13" fill="var(--marino)" stroke="#fff" stroke-width="3"/></g>
    </svg>

    <div class="word" aria-label="ArgenIA">
      <span style="--i:0">A</span><span style="--i:1">r</span><span style="--i:2">g</span><span style="--i:3">e</span><span style="--i:4">n</span><span class="ia">IA</span>
    </div>
  </div>
  <div class="tira"><i></i><i></i><i></i></div>
</section>

<!-- Aquí irán las próximas diapositivas: <section class="dia" id="d2">…</section> -->

</div>
<div id="ayuda">R · repetir animación &nbsp;|&nbsp; F · pantalla completa</div>

<script>
(() => {
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const E = $('#escenario'), dias = $$('.dia'), N = dias.length; let cur = 0;

  /* Espejo del lado izquierdo → derecho */
  $$('[data-m]').forEach(g => {
    const w = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    w.setAttribute('transform', 'matrix(-1 0 0 1 444 0)');
    const c = g.cloneNode(true); c.removeAttribute('data-m'); w.appendChild(c);
    g.after(w); g.removeAttribute('data-m');
  });

  /* Escenario 1920×1080 escalado */
  const fit = () => { const S = Math.min(innerWidth / 1920, innerHeight / 1080); E.style.transform = `translate(-50%,-50%) scale(${S})`; };
  addEventListener('resize', fit); fit();

  /* Animación de portada */
  const d1 = $('#d1');
  const play = () => { d1.classList.remove('go'); void d1.offsetWidth; requestAnimationFrame(() => d1.classList.add('go')); };

  function go(n) {
    n = Math.max(0, Math.min(N - 1, n)); if (n === cur) return;
    dias[cur].classList.remove('activa'); cur = n; dias[cur].classList.add('activa');
    if (cur === 0) play();
  }
  const fs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  addEventListener('keydown', e => {
    if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); go(cur + 1); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) go(cur - 1);
    else if (e.key === 'r' || e.key === 'R') play();
    else if (e.key === 'f' || e.key === 'F') fs();
  });
  d1.addEventListener('click', e => { if (e.detail === 2) play(); });
  play();
})();
</script>
</body>
</html>
